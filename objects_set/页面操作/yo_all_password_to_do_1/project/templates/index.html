{% extends "base.html"  %}
 
{% block content %}
<h2 class="mb-4">密码记录列表</h2>
 
{% if passwords %}
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>名称</th>
                <th>URL</th>
                <th>用户名</th>
                <th>备注</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for pwd in passwords %}
            <tr>
                <td>{{ pwd.id  }}</td>
                <td>{{ pwd.name  }}</td>
                <td><a href="{{ pwd.url  }}" target="_blank">{{ pwd.url  }}</a></td>
                <td>{{ pwd.username  }}</td>
                <td>{{ pwd.note  }}</td>
                <td>
                    <a href="{{ url_for('edit_password', id=pwd.id)  }}" class="btn btn-sm btn-primary">编辑</a>
                    <a href="{{ url_for('delete_password', id=pwd.id)  }}" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除这条记录吗?')">删除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="alert alert-info">暂无密码记录，请点击"添加记录"开始添加。</div>
{% endif %}
{% endblock %}
