<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUNGOWL | 密码管理系统</title>
    <link href="https://s2.ssl.qhres2.com/static/56662140ef7d5d03.css"  rel="stylesheet">
    <link href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/font-awesome/6.0.0/css/all.min.css"  rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
        }

        .logo i {
            margin-right: 0.5rem;
            color: var(--secondary);
        }

        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .card-header {
            padding: 1rem 1.5rem;
            background: var(--primary);
            color: white;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            padding: 1.5rem;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table th {
            font-weight: 600;
            color: var(--primary);
            background: #f8f9fa;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn i {
            margin-right: 0.5rem;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.active  {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 0.5rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal.active  .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
        }

        .close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .close:hover {
            color: var(--dark);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #777;
            font-size: 0.875rem;
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
        }

        .alert {
            padding: 1rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }

        .alert-success {
            background: rgba(46, 204, 113, 0.1);
            border-left: 4px solid var(--success);
            color: var(--success);
        }

        .alert-danger {
            background: rgba(231, 76, 60, 0.1);
            border-left: 4px solid var(--danger);
            color: var(--danger);
        }

        .alert i {
            margin-right: 0.5rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .search-bar {
            display: flex;
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            flex: 1;
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 0.25rem 0 0 0.25rem;
            border-right: none;
        }

        .search-bar button {
            padding: 0.5rem 1rem;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 0 0.25rem 0.25rem 0;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #777;
        }

        .empty-state i {
            font-size: 3rem;
            color: #ddd;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-lock"></i>
                YOUNGOWL 密码管理系统
            </div>
            <button id="addBtn" class="btn btn-primary">
                <i class="fas fa-plus"></i> 添加记录
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">总记录数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="recentAdded">0</div>
                <div class="stat-label">最近新增</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="updatedCount">0</div>
                <div class="stat-label">已更新</div>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="card-header">
                <span>密码记录</span>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="搜索名称、URL或用户名...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>URL</th>
                                <th>用户名</th>
                                <th>密码</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="passwordTable">
                            <!-- 数据将通过JavaScript动态加载 -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <i class="fas fa-database"></i>
                    <h3>暂无数据</h3>
                    <p>点击上方"添加记录"按钮创建第一条密码记录</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑模态框 -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">添加密码记录</h3>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="passwordForm">
                    <input type="hidden" id="recordId">
                    <div class="form-group">
                        <label for="name" class="form-label">名称</label>
                        <input type="text" id="name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="url" class="form-label">URL</label>
                        <input type="url" id="url" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">密码</label>
                        <div class="password-field">
                            <input type="password" id="password" class="form-control" required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="note" class="form-label">备注</label>
                        <textarea id="note" class="form-control" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" id="cancelBtn">取消</button>
                <button class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">确认删除</h3>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <p>您确定要删除这条记录吗？此操作无法撤销。</p>
            </div>
            <div class="modal-footer">
                <button class="btn" id="cancelDeleteBtn">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentRecordId = null;
        let passwordVisible = false;

        // DOM元素
        const passwordTable = document.getElementById('passwordTable');
        const passwordModal = document.getElementById('passwordModal');
        const confirmModal = document.getElementById('confirmModal');
        const passwordForm = document.getElementById('passwordForm');
        const modalTitle = document.getElementById('modalTitle');
        const recordIdInput = document.getElementById('recordId');
        const nameInput = document.getElementById('name');
        const urlInput = document.getElementById('url');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const noteInput = document.getElementById('note');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const addBtn = document.getElementById('addBtn');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const emptyState = document.getElementById('emptyState');
        const alertContainer = document.getElementById('alertContainer');
        const totalCountElement = document.getElementById('totalCount');
        const recentAddedElement = document.getElementById('recentAdded');
        const updatedCountElement = document.getElementById('updatedCount');

        // 模态框控制
        function openModal() {
            passwordModal.classList.add('active');
            document.body.style.overflow  = 'hidden';
        }

        function closeModal() {
            passwordModal.classList.remove('active');
            document.body.style.overflow  = 'auto';
        }

        function openConfirmModal() {
            confirmModal.classList.add('active');
            document.body.style.overflow  = 'hidden';
        }

        function closeConfirmModal() {
            confirmModal.classList.remove('active');
            document.body.style.overflow  = 'auto';
        }

        // 显示/隐藏密码
        togglePasswordBtn.addEventListener('click',  function() {
            passwordVisible = !passwordVisible;
            passwordInput.type  = passwordVisible ? 'text' : 'password';
            togglePasswordBtn.innerHTML  = passwordVisible ?
                '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
        });

        // 添加记录按钮
        addBtn.addEventListener('click',  function() {
            resetForm();
            modalTitle.textContent  = '添加密码记录';
            openModal();
        });

        // 保存记录
        saveBtn.addEventListener('click',  function() {
            if (!passwordForm.checkValidity())  {
                showAlert('请填写所有必填字段', 'danger');
                return;
            }

            const formData = {
                id: recordIdInput.value,
                name: nameInput.value,
                url: urlInput.value,
                username: usernameInput.value,
                password: passwordInput.value,
                note: noteInput.value
            };

            if (formData.id)  {
                // 更新记录
                updateRecord(formData);
            } else {
                // 添加新记录
                addRecord(formData);
            }
        });

        // 取消按钮
        cancelBtn.addEventListener('click',  closeModal);
        cancelDeleteBtn.addEventListener('click',  closeConfirmModal);

        // 关闭按钮
        document.querySelectorAll('.close').forEach(btn  => {
            btn.addEventListener('click',  function() {
                if (passwordModal.classList.contains('active'))  {
                    closeModal();
                } else {
                    closeConfirmModal();
                }
            });
        });

        // 点击模态框外部关闭
        window.addEventListener('click',  function(e) {
            if (e.target  === passwordModal) {
                closeModal();
            }
            if (e.target  === confirmModal) {
                closeConfirmModal();
            }
        });

        // 搜索功能
        searchBtn.addEventListener('click',  function() {
            loadPasswords(searchInput.value);
        });

        searchInput.addEventListener('keypress',  function(e) {
            if (e.key  === 'Enter') {
                loadPasswords(searchInput.value);
            }
        });

        // 重置表单
        function resetForm() {
            passwordForm.reset();
            recordIdInput.value  = '';
            passwordVisible = false;
            passwordInput.type  = 'password';
            togglePasswordBtn.innerHTML  = '<i class="fas fa-eye"></i>';
        }

        // 显示提示信息
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className  = `alert alert-${type} fade-in`;
            alert.innerHTML  = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // 加载密码数据
        function loadPasswords(searchTerm = '') {
            fetch('api.php?action=get_passwords&search='  + encodeURIComponent(searchTerm))
                .then(response => response.json())
                .then(data => {
                    if (data.success)  {
                        renderTable(data.passwords);
                        updateStats(data.stats);

                        if (data.passwords.length  === 0) {
                            emptyState.style.display  = 'block';
                        } else {
                            emptyState.style.display  = 'none';
                        }
                    } else {
                        showAlert('加载数据失败: ' + data.message,  'danger');
                    }
                })
                .catch(error => {
                    showAlert('网络错误: ' + error.message,  'danger');
                });
        }

        // 渲染表格
        function renderTable(passwords) {
            passwordTable.innerHTML  = '';

            passwords.forEach(password  => {
                const row = document.createElement('tr');
                row.innerHTML  = `
                    <td>${password.id}</td>
                    <td>${password.name}</td>
                    <td>${password.url  ? `<a href="${password.url.startsWith('http')  ? password.url  : 'http://' + password.url}"  target="_blank">${password.url}</a>`  : '-'}</td>
                    <td>${password.username}</td>
                    <td>
                        <span class="password-text" style="-webkit-text-security: disc;">${password.password.replace(/./g,  '•')}</span>
                        <button class="btn btn-sm" onclick="togglePasswordVisibility(this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                    <td>${password.note  || '-'}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editRecord(${password.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="confirmDelete(${password.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                passwordTable.appendChild(row);
            });
        }

        // 更新统计信息
        function updateStats(stats) {
            totalCountElement.textContent  = stats.total  || 0;
            recentAddedElement.textContent  = stats.recent_added  || 0;
            updatedCountElement.textContent  = stats.updated  || 0;
        }

        // 添加记录
        function addRecord(formData) {
            fetch('api.php?action=add_password',  {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success)  {
                    showAlert('记录添加成功', 'success');
                    closeModal();
                    loadPasswords();
                } else {
                    showAlert('添加失败: ' + data.message,  'danger');
                }
            })
            .catch(error => {
                showAlert('网络错误: ' + error.message,  'danger');
            });
        }

        // 编辑记录
        function editRecord(id) {
            fetch('api.php?action=get_password&id='  + id)
                .then(response => response.json())
                .then(data => {
                    if (data.success)  {
                        const password = data.password;
                        recordIdInput.value  = password.id;
                        nameInput.value  = password.name;
                        urlInput.value  = password.url  || '';
                        usernameInput.value  = password.username;
                        passwordInput.value  = password.password;
                        noteInput.value  = password.note  || '';

                        modalTitle.textContent  = '编辑密码记录';
                        openModal();
                    } else {
                        showAlert('获取记录失败: ' + data.message,  'danger');
                    }
                })
                .catch(error => {
                    showAlert('网络错误: ' + error.message,  'danger');
                });
        }

        // 更新记录
        function updateRecord(formData) {
            fetch('api.php?action=update_password',  {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success)  {
                    showAlert('记录更新成功', 'success');
                    closeModal();
                    loadPasswords();
                } else {
                    showAlert('更新失败: ' + data.message,  'danger');
                }
            })
            .catch(error => {
                showAlert('网络错误: ' + error.message,  'danger');
            });
        }

        // 确认删除
        function confirmDelete(id) {
            currentRecordId = id;
            openConfirmModal();
        }

        // 删除记录
        confirmDeleteBtn.addEventListener('click',  function() {
            fetch('api.php?action=delete_password&id='  + currentRecordId)
                .then(response => response.json())
                .then(data => {
                    if (data.success)  {
                        showAlert('记录删除成功', 'success');
                        closeConfirmModal();
                        loadPasswords();
                    } else {
                        showAlert('删除失败: ' + data.message,  'danger');
                    }
                })
                .catch(error => {
                    showAlert('网络错误: ' + error.message,  'danger');
                });
        });

        // 全局函数 - 切换密码可见性
        window.togglePasswordVisibility  = function(button) {
            const row = button.closest('tr');
            const passwordText = row.querySelector('.password-text');
            const icon = button.querySelector('i');

            if (passwordText.style.webkitTextSecurity  === 'disc') {
                passwordText.style.webkitTextSecurity  = 'none';
                icon.className  = 'fas fa-eye-slash';
            } else {
                passwordText.style.webkitTextSecurity  = 'disc';
                icon.className  = 'fas fa-eye';
            }
        };

        // 初始化加载数据
        loadPasswords();
    </script>
</body>
</html>
