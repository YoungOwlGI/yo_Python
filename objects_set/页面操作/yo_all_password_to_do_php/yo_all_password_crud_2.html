<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUNGOWL | 密码管理系统</title>
    <link href="https://s2.ssl.qhres2.com/static/56662140ef7d5d03.css"  rel="stylesheet">
    <link href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-100-M/font-awesome/6.0.0/css/all.min.css"  rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: #f5f7fa;
            color: var(--dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--accent);
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            padding: 1rem 1.5rem;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-body {
            padding: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: #219653;
        }

        .btn i {
            margin-right: 0.5rem;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .table th {
            font-weight: 600;
            color: var(--primary);
            background-color: rgba(0,0,0,0.02);
        }

        .table tr:hover {
            background-color: rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 4px;
            transition: var(--transition);
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal.show  {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: white;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 500px;
            transform: translateY(-20px);
            transition: var(--transition);
        }

        .modal.show  .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: rgba(0,0,0,0.5);
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(0,0,0,0.5);
        }

        .alert {
            padding: 0.75rem 1.25rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background-color: rgba(39, 174, 96, 0.1);
            color: var(--success);
            border-left: 4px solid var(--success);
        }

        .alert-danger {
            background-color: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            border-left: 4px solid var(--danger);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-primary {
            background-color: rgba(52, 152, 219, 0.1);
            color: var(--secondary);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .search-box {
            position: relative;
            max-width: 300px;
        }

        .search-input {
            padding-left: 2.5rem;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0,0,0,0.5);
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: rgba(0,0,0,0.5);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="header">
            <div class="logo">YOUNG<span>OWL</span> <span class="badge badge-primary">PASSWORD MANAGER</span></div>
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="form-control search-input" placeholder="Rechercher...">
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="card-header">
                <span><i class="fas fa-key"></i> 密码管理</span>
                <button id="addPasswordBtn" class="btn btn-primary"><i class="fas fa-plus"></i> 添加密码</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>名称</th>
                                <th>URL</th>
                                <th>用户名</th>
                                <th>密码</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="passwordTableBody">
                            <!-- 数据将通过JavaScript动态加载 -->
                            <tr>
                                <td colspan="7" class="empty-state">
                                    <i class="fas fa-key"></i>
                                    <p>暂无密码记录</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑密码模态框 -->
    <div id="passwordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">添加密码</h5>
                <button class="close">&times;</button>
            </div>
            <form id="passwordForm">
                <div class="modal-body">
                    <input type="hidden" id="passwordId">
                    <div class="form-group">
                        <label for="name" class="form-label">名称</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="url" class="form-label">URL</label>
                        <input type="url" class="form-control" id="url">
                    </div>
                    <div class="form-group">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">密码</label>
                        <div class="password-field">
                            <input type="password" class="form-control" id="password" required>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="note" class="form-label">备注</label>
                        <textarea class="form-control" id="note" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger close-btn">取消</button>
                    <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> 保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button class="close">&times;</button>
            </div>
            <div class="modal-body">
                <p>确定要删除这条密码记录吗？此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger close-btn">取消</button>
                <button type="button" class="btn btn-success" id="confirmDeleteBtn"><i class="fas fa-trash"></i> 确认删除</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let passwords = [];
        let currentPasswordId = null;

        // DOM元素
        const passwordTableBody = document.getElementById('passwordTableBody');
        const passwordModal = document.getElementById('passwordModal');
        const confirmModal = document.getElementById('confirmModal');
        const passwordForm = document.getElementById('passwordForm');
        const modalTitle = document.getElementById('modalTitle');
        const addPasswordBtn = document.getElementById('addPasswordBtn');
        const togglePassword = document.getElementById('togglePassword');
        const passwordField = document.getElementById('password');
        const searchInput = document.getElementById('searchInput');
        const alertContainer = document.getElementById('alertContainer');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const closeButtons = document.querySelectorAll('.close,  .close-btn');

        // 初始化
        document.addEventListener('DOMContentLoaded',  () => {
            fetchPasswords();
            setupEventListeners();
        });

        // 设置事件监听器
        function setupEventListeners() {
            // 添加密码按钮
            addPasswordBtn.addEventListener('click',  () => {
                showModal('add');
            });

            // 密码显示/隐藏切换
            togglePassword.addEventListener('click',  () => {
                const type = passwordField.getAttribute('type')  === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type',  type);
                togglePassword.innerHTML  = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });

            // 搜索功能
            searchInput.addEventListener('input',  () => {
                const searchTerm = searchInput.value.toLowerCase();
                if (searchTerm) {
                    const filteredPasswords = passwords.filter(pwd  =>
                        pwd.name.toLowerCase().includes(searchTerm)  ||
                        pwd.url.toLowerCase().includes(searchTerm)  ||
                        pwd.username.toLowerCase().includes(searchTerm)  ||
                        (pwd.note  && pwd.note.toLowerCase().includes(searchTerm))
                    );
                    renderPasswordTable(filteredPasswords);
                } else {
                    renderPasswordTable(passwords);
                }
            });

            // 表单提交
            passwordForm.addEventListener('submit',  (e) => {
                e.preventDefault();
                savePassword();
            });

            // 确认删除
            confirmDeleteBtn.addEventListener('click',  () => {
                deletePassword(currentPasswordId);
                hideModal(confirmModal);
            });

            // 关闭模态框
            closeButtons.forEach(btn  => {
                btn.addEventListener('click',  () => {
                    if (btn.classList.contains('close-btn')  || btn.classList.contains('close'))  {
                        const modal = btn.closest('.modal');
                        hideModal(modal);
                    }
                });
            });

            // 点击模态框外部关闭
            [passwordModal, confirmModal].forEach(modal => {
                modal.addEventListener('click',  (e) => {
                    if (e.target  === modal) {
                        hideModal(modal);
                    }
                });
            });
        }

        // 获取密码列表
        async function fetchPasswords() {
            try {
                // 这里应该替换为实际的API端点
                // const response = await fetch('/api/passwords');
                // passwords = await response.json();

                // 模拟数据 - 实际使用时应该删除
                passwords = [
                    { id: 1, name: 'Google', url: 'https://google.com',  username: 'user1@gmail.com',  password: 'password123', note: '个人账号' },
                    { id: 2, name: 'GitHub', url: 'https://github.com',  username: 'dev1', password: 'githubpass', note: '工作账号' },
                    { id: 3, name: 'AWS', url: 'https://aws.amazon.com',  username: 'admin@company.com',  password: 'awsp@ssw0rd', note: '云服务管理' }
                ];

                renderPasswordTable(passwords);
            } catch (error) {
                showAlert('获取密码列表失败: ' + error.message,  'danger');
            }
        }

        // 渲染密码表格
        function renderPasswordTable(data) {
            if (data.length  === 0) {
                passwordTableBody.innerHTML  = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fas fa-key"></i>
                            <p>暂无密码记录</p>
                        </td>
                    </tr>
                `;
                return;
            }

            passwordTableBody.innerHTML  = data.map(password  => `
                <tr>
                    <td>${password.id}</td>
                    <td>${password.name}</td>
                    <td>${password.url  ? `<a href="${password.url}"  target="_blank">${password.url}</a>`  : 'N/A'}</td>
                    <td>${password.username}</td>
                    <td>••••••••</td>
                    <td>${password.note  || 'N/A'}</td>
                    <td class="actions">
                        <button class="btn btn-primary btn-sm edit-btn" data-id="${password.id}"><i  class="fas fa-edit"></i></button>
                        <button class="btn btn-danger btn-sm delete-btn" data-id="${password.id}"><i  class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // 添加编辑和删除按钮的事件监听器
            document.querySelectorAll('.edit-btn').forEach(btn  => {
                btn.addEventListener('click',  () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    showModal('edit', id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn  => {
                btn.addEventListener('click',  () => {
                    const id = parseInt(btn.getAttribute('data-id'));
                    showDeleteConfirmation(id);
                });
            });
        }

        // 显示模态框
        function showModal(action, id = null) {
            if (action === 'add') {
                modalTitle.textContent  = '添加密码';
                passwordForm.reset();
                currentPasswordId = null;
            } else if (action === 'edit' && id) {
                modalTitle.textContent  = '编辑密码';
                const password = passwords.find(p  => p.id  === id);
                if (password) {
                    document.getElementById('passwordId').value  = password.id;
                    document.getElementById('name').value  = password.name;
                    document.getElementById('url').value  = password.url  || '';
                    document.getElementById('username').value  = password.username;
                    document.getElementById('password').value  = password.password;
                    document.getElementById('note').value  = password.note  || '';
                    currentPasswordId = id;
                }
            }
            passwordModal.classList.add('show');
        }

        // 显示删除确认对话框
        function showDeleteConfirmation(id) {
            currentPasswordId = id;
            confirmModal.classList.add('show');
        }

        // 隐藏模态框
        function hideModal(modal) {
            modal.classList.remove('show');
        }

        // 保存密码
        async function savePassword() {
            const id = document.getElementById('passwordId').value;
            const passwordData = {
                name: document.getElementById('name').value,
                url: document.getElementById('url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                note: document.getElementById('note').value
            };

            try {
                // 这里应该替换为实际的API端点
                // const url = id ? `/api/passwords/${id}` : '/api/passwords';
                // const method = id ? 'PUT' : 'POST';
                // const response = await fetch(url, {
                //     method,
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify(passwordData)
                // });

                // 模拟保存 - 实际使用时应该删除
                if (id) {
                    // 更新现有密码
                    const index = passwords.findIndex(p  => p.id  === parseInt(id));
                    if (index !== -1) {
                        passwords[index] = { ...passwords[index], ...passwordData };
                    }
                } else {
                    // 添加新密码
                    const newId = passwords.length  > 0 ? Math.max(...passwords.map(p  => p.id))  + 1 : 1;
                    passwords.push({  id: newId, ...passwordData });
                }

                hideModal(passwordModal);
                renderPasswordTable(passwords);
                showAlert(`密码已${id ? '更新' : '添加'}成功`, 'success');
            } catch (error) {
                showAlert(`保存密码失败: ${error.message}`,  'danger');
            }
        }

        // 删除密码
        async function deletePassword(id) {
            try {
                // 这里应该替换为实际的API端点
                // await fetch(`/api/passwords/${id}`, { method: 'DELETE' });

                // 模拟删除 - 实际使用时应该删除
                passwords = passwords.filter(p  => p.id  !== id);

                renderPasswordTable(passwords);
                showAlert('密码已删除', 'success');
            } catch (error) {
                showAlert(`删除密码失败: ${error.message}`,  'danger');
            }
        }

        // 显示提示消息
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className  = `alert alert-${type} fade-in`;
            alert.innerHTML  = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            alertContainer.appendChild(alert);

            // 3秒后自动消失
            setTimeout(() => {
                alert.classList.add('fade-out');
                setTimeout(() => alert.remove(),  500);
            }, 3000);
        }
    </script>
</body>
</html>
